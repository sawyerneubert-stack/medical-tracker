<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Device Intelligence Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

  header { background: linear-gradient(135deg, #1a237e 0%, #0d47a1 60%, #006064 100%); padding: 44px 24px; text-align: center; }
  header h1 { font-size: 2.1rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  header p { margin-top: 10px; color: #b3e5fc; font-size: 0.95rem; }
  .updated { margin-top: 14px; display: inline-block; background: rgba(255,255,255,0.12); border-radius: 20px; padding: 5px 18px; font-size: 0.8rem; color: #e0f7fa; }

  .controls { max-width: 1240px; margin: 28px auto 0; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .search-box { flex: 1; min-width: 200px; }
  .search-box input { width: 100%; padding: 11px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 0.95rem; outline: none; }
  .search-box input:focus { border-color: #3b82f6; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-btn { padding: 7px 16px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 0.82rem; transition: all 0.15s; }
  .filter-btn:hover { border-color: #3b82f6; color: #e2e8f0; }
  .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }

  .stats { max-width: 1240px; margin: 20px auto 0; padding: 0 24px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; text-align: center; }
  .stat-card .num { font-size: 2rem; font-weight: 700; color: #3b82f6; }
  .stat-card .label { font-size: 0.73rem; color: #94a3b8; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

  .grid { max-width: 1240px; margin: 24px auto 0; padding: 0 24px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.2s, box-shadow 0.2s; }
  .card:hover { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f620; }
  .card-meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .badge-urology { background: #1e3a5f; color: #60a5fa; }
  .badge-radiation { background: #14291f; color: #4ade80; }
  .badge-surgical { background: #3b1a1a; color: #f87171; }
  .badge-source { background: transparent; border: 1px solid #475569; color: #94a3b8; }
  .card-date { font-size: 0.72rem; color: #64748b; margin-left: auto; white-space: nowrap; }
  .card h3 { font-size: 0.93rem; font-weight: 600; color: #e2e8f0; line-height: 1.45; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { color: #60a5fa; }
  .card p { font-size: 0.82rem; color: #94a3b8; line-height: 1.55; flex: 1; }
  .read-link { font-size: 0.8rem; color: #3b82f6; text-decoration: none; font-weight: 500; }
  .read-link:hover { text-decoration: underline; }
  .no-results { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: #64748b; }
  .no-results h3 { font-size: 1.1rem; margin-bottom: 8px; }
  footer { text-align: center; padding: 28px; color: #475569; font-size: 0.78rem; border-top: 1px solid #1e293b; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <h1>Medical Device Intelligence</h1>
  <p>Competitive tracking &mdash; Urology / BPH &bull; Radiation Spacers &bull; Surgical Implants</p>
  <span class="updated">Last updated: September 03, 2026 at 12:23 PM</span>
</header>

<div class="controls">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by product, keyword, source..." oninput="render()">
  </div>
  <div class="filters" id="filterRow">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  </div>
</div>

<div class="stats"><div class="stat-row" id="statRow"></div></div>
<div class="grid" id="grid"></div>

<footer>
  Sources: Google News &bull; Reddit &bull; PubMed &bull; FDA &nbsp;&bull;&nbsp; Refreshes every 2 days &nbsp;&bull;&nbsp; For informational purposes only
</footer>

<script>
const DATA = [{"title": "HypnoVR®in minimally invasive surgical techniques (MISTs) for lower urinary tract symptoms (LUTS): a safe, sedation-reducing tool improving patient experience.", "url": "https://pubmed.ncbi.nlm.nih.gov/42682062/", "description": "Journal: Can J Urol", "date": "2026 Aug 21", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Cost-Effectiveness of Contemporary Surgical Treatment Options for Benign Prostatic Hyperplasia.", "url": "https://pubmed.ncbi.nlm.nih.gov/42648558/", "description": "Journal: Urology", "date": "2026 Aug 26", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Clinical insights: regarding \"Internal urethrotomy versus Optilume™ drug-coated balloon dilatation for the management of anterior urethral strictures: morbidity comparison of the techniques\".", "url": "https://pubmed.ncbi.nlm.nih.gov/42645577/", "description": "Journal: World J Urol", "date": "2026 Aug 26", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Safety and Efficacy of Rezūm Water Vapor Energy Therapy for Benign Prostatic Hyperplasia With Continued Antithrombotic Therapy: A Comparative Study.", "url": "https://pubmed.ncbi.nlm.nih.gov/42638164/", "description": "Journal: Low Urin Tract Symptoms", "date": "2026 Sep", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Editorial Comment on \"Still ROBUST: A Retrospective Study of Optilume Drug-Coated Balloon Dilation for Complex Urethral Stricture Disease\".", "url": "https://pubmed.ncbi.nlm.nih.gov/42628580/", "description": "Journal: Urology", "date": "2026 Aug 21", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Reconsidering the evidence for size-independent outcomes after Aquablation.", "url": "https://pubmed.ncbi.nlm.nih.gov/42622718/", "description": "Journal: World J Urol", "date": "2026 Aug 20", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Aquablation/AquaBeam Waterjet Therapy for Benign Prostatic Hyperplasia: Three-Year Functional and Ejaculatory Outcomes in a Multicenter Real-World Italian Cohort.", "url": "https://pubmed.ncbi.nlm.nih.gov/42608940/", "description": "Journal: Low Urin Tract Symptoms", "date": "2026 Sep", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Water Vapor Thermal Therapy with Rezūm Versus Combination Pharmacotherapy for Male Lower Urinary Tract Symptoms due to Benign Prostatic Obstruction: 1-Yr Results From a Prospective, Multicenter, Pragmatic Randomized Controlled Trial (VAPEUR-RCT).", "url": "https://pubmed.ncbi.nlm.nih.gov/42608232/", "description": "Journal: Eur Urol Focus", "date": "2026 Aug 18", "source": "PubMed", "category": "Urology / BPH"}, {"title": "Clinical evaluation of novel deep learning-based auto-segmentation software: Utility and potential pitfalls.", "url": "https://pubmed.ncbi.nlm.nih.gov/42638554/", "description": "Journal: J Appl Clin Med Phys", "date": "2026 Sep", "source": "PubMed", "category": "Radiation Spacers"}, {"title": "Impact of Hydrogel Spacer on Radiation Proctitis After Prostate Cancer Radiation Therapy: A Large-Scale Claims Database Analysis.", "url": "https://pubmed.ncbi.nlm.nih.gov/42604081/", "description": "Journal: Adv Radiat Oncol", "date": "2026 Nov", "source": "PubMed", "category": "Radiation Spacers"}, {"title": "Deep Learning-Based CT Segmentation of a Non-radiopaque Hydrogel Rectal Spacer in Prostate Radiotherapy.", "url": "https://pubmed.ncbi.nlm.nih.gov/42528807/", "description": "Journal: Cureus", "date": "2026 Jun", "source": "PubMed", "category": "Radiation Spacers"}, {"title": "Dosimetric analysis of post-radiotherapy sexual dysfunction in patients receiving definitive stereotactic body radiotherapy (SBRT) for prostate cancer: a secondary analysis of MIRAGE.", "url": "https://pubmed.ncbi.nlm.nih.gov/42435817/", "description": "Journal: Radiother Oncol", "date": "2026 Sep", "source": "PubMed", "category": "Radiation Spacers"}, {"title": "Same-day Hyaluronic Acid rectal spacer for TRUS-guided HDR Prostate Brachytherapy: Feasibility and dosimetric outcomes.", "url": "https://pubmed.ncbi.nlm.nih.gov/42418218/", "description": "Journal: J Appl Clin Med Phys", "date": "2026 Jul", "source": "PubMed", "category": "Radiation Spacers"}, {"title": "Is there an association between acute, subacute, and late genitourinary quality of life with prostate SBRT boost?", "url": "https://pubmed.ncbi.nlm.nih.gov/42320679/", "description": "Journal: Radiother Oncol", "date": "2026 Sep", "source": "PubMed", "category": "Radiation Spacers"}, {"title": "Intrafraction Motion Mitigation by Rectal Spacers in Prostate Stereotactic Body Radiation Therapy: Balloon, Hydrogel, and No-Spacer Comparison.", "url": "https://pubmed.ncbi.nlm.nih.gov/42142816/", "description": "Journal: Pract Radiat Oncol", "date": "2026 Sep-Oct", "source": "PubMed", "category": "Radiation Spacers"}, {"title": "Comparative analysis of radiation therapy plans before and after biodegradable hydrogel (SpaceOAR) injection for reducing rectal toxicity in patients with prostate cancer undergoing carbon ion radiotherapy.", "url": "https://pubmed.ncbi.nlm.nih.gov/42088204/", "description": "Journal: Front Oncol", "date": "2026", "source": "PubMed", "category": "Radiation Spacers"}];
let activeFilter = 'all';

function clean(s) {
  return (s || '').replace(/<[^>]*>/g, '')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();
}

function fmtDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    if (isNaN(d)) return s.split(' ').slice(0,3).join(' ');
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  } catch(e) { return ''; }
}

function catClass(cat) {
  if (cat.includes('Urology') || cat.includes('BPH')) return 'badge-urology';
  if (cat.includes('Radiation')) return 'badge-radiation';
  return 'badge-surgical';
}

function setFilter(val, el) {
  activeFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const term = document.getElementById('searchInput').value.toLowerCase();
  const filtered = DATA.filter(item => {
    const matchCat = activeFilter === 'all' || item.category === activeFilter;
    const matchSearch = !term ||
      clean(item.title).toLowerCase().includes(term) ||
      (item.description || '').toLowerCase().includes(term) ||
      item.source.toLowerCase().includes(term) ||
      item.category.toLowerCase().includes(term);
    return matchCat && matchSearch;
  });

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results"><h3>No results found</h3><p>Try a different search or filter.</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const title = clean(item.title);
    const desc = clean(item.description);
    const date = fmtDate(item.date);
    const srcShort = item.source.replace('Reddit ', '');
    return `<div class="card">
      <div class="card-meta">
        <span class="badge ${catClass(item.category)}">${item.category}</span>
        <span class="badge badge-source">${srcShort}</span>
        ${date ? `<span class="card-date">${date}</span>` : ''}
      </div>
      <h3><a href="${item.url}" target="_blank" rel="noopener">${title}</a></h3>
      ${desc ? `<p>${desc}</p>` : ''}
      <a href="${item.url}" target="_blank" rel="noopener" class="read-link">Read more &rarr;</a>
    </div>`;
  }).join('');
}

function buildUI() {
  const cats = [...new Set(DATA.map(i => i.category))].sort();
  const filterRow = document.getElementById('filterRow');
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = cat;
    btn.onclick = function() { setFilter(cat, this); };
    filterRow.appendChild(btn);
  });

  const counts = {};
  DATA.forEach(i => counts[i.category] = (counts[i.category] || 0) + 1);
  const statRow = document.getElementById('statRow');
  statRow.innerHTML =
    `<div class="stat-card"><div class="num">${DATA.length}</div><div class="label">Total items</div></div>` +
    Object.entries(counts).map(([cat, n]) =>
      `<div class="stat-card"><div class="num">${n}</div><div class="label">${cat}</div></div>`
    ).join('');

  render();
}

buildUI();
</script>
</body>
</html>
