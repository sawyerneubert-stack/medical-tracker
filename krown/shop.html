<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Cpath d='M3 19 5 6l6.5 6.5L16 3l4.5 9.5L27 6l2 13Z' fill='%23b08d57'/%3E%3C/svg%3E">
<title>Shop All Watches | KROWN Watches</title>
<meta name="description" content="Shop classic, sport, luxury and minimalist watches from KROWN Watches.">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <div class="page-head">
    <div class="container">
      <div class="eyebrow">The Collection</div>
      <h1 id="shop-title">Shop All</h1>
      <p id="shop-sub">Classic, sport, luxury and minimalist watches, made for every wrist.</p>
    </div>
  </div>
  <div class="container">
    <nav class="filter-bar" id="filters" aria-label="Categories"></nav>
    <div class="grid" id="products"></div>
  </div>
  <div class="section"></div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
  (function () {
    const { $, esc, param, cardHTML } = window.K;
    const cat = window.CATEGORIES.find((c) => c.id === param("cat"));
    const tabs = [{ id: "", name: "All" }].concat(window.CATEGORIES);
    $("#filters").innerHTML = tabs
      .map((c) => `<a href="shop.html${c.id ? "?cat=" + c.id : ""}" aria-current="${(cat ? cat.id : "") === c.id}">${esc(c.name)}</a>`)
      .join("");
    if (cat) {
      $("#shop-title").textContent = cat.name;
      document.title = `${cat.name} | KROWN Watches`;
    }
    const list = window.PRODUCTS.filter((p) => !cat || p.category === cat.id);
    $("#products").innerHTML = list.map(cardHTML).join("");
  })();
</script>
</body>
</html>
