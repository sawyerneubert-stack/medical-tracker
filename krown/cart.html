<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Cpath d='M3 19 5 6l6.5 6.5L16 3l4.5 9.5L27 6l2 13Z' fill='%23b08d57'/%3E%3C/svg%3E">
<title>Your Cart | KROWN Jewelers</title>
<meta name="robots" content="noindex">
</head>
<body data-page="cart">
<div id="site-header"></div>

<main class="container" id="cart-root"></main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
  (function () {
    const { $, esc, money, product, Cart, cfg } = window.K;
    const root = $("#cart-root");

    function render() {
      const t = Cart.totals("standard");
      if (!t.lines.length) {
        root.innerHTML = `<div class="empty-state"><h1>Your cart is empty</h1><p>Discover pieces made for every moment.</p><a class="btn" href="shop.html">Shop Now</a></div>`;
        return;
      }
      const threshold = cfg.freeShippingOver * 100;
      const remaining = Math.max(0, threshold - t.subtotal);
      root.innerHTML = `
        <div class="cart-layout">
          <div>
            <h1 style="margin-bottom:24px">Your Cart</h1>
            <div class="cart-table">${t.lines
              .map((l) => {
                const p = product(l.id);
                const k = esc(Cart.key(l));
                const url = `product.html?id=${encodeURIComponent(p.id)}`;
                return `<div class="cart-line">
                  <a href="${url}"><img src="${esc(p.images[0])}" alt="${esc(p.name)}" width="110" height="110"></a>
                  <div>
                    <h3><a href="${url}">${esc(p.name)}</a></h3>
                    <div class="opts">${money(p.price)}${l.size ? " · Size " + esc(l.size) : ""}</div>
                    <div class="line-actions">
                      <div class="qty qty-sm" aria-label="Quantity"><button data-dec="${k}" aria-label="Decrease quantity">−</button><span>${l.qty}</span><button data-inc="${k}" aria-label="Increase quantity">+</button></div>
                      <button class="remove-btn" data-remove="${k}">Remove</button>
                    </div>
                  </div>
                  <div class="line-total">${money((p.price * 100 * l.qty) / 100)}</div>
                </div>`;
              })
              .join("")}</div>
            <p style="margin-top:22px"><a href="shop.html" class="link-sm">← Continue shopping</a></p>
          </div>
          <aside class="summary-box">
            <h2>Order Summary</h2>
            <div class="ship-progress">${
              remaining > 0
                ? `You're <b>${money(remaining / 100)}</b> away from free shipping`
                : `You've unlocked <b>free shipping</b>`
            }<div class="bar"><i style="width:${Math.min(100, (t.subtotal / threshold) * 100)}%"></i></div></div>
            <div class="sum-row"><span>Subtotal</span><span>${money(t.subtotal / 100)}</span></div>
            <div class="sum-row"><span>Shipping</span><span>${t.shipping ? money(t.shipping / 100) : "Free"}</span></div>
            <div class="sum-row total"><span>Total</span><span>${money(t.total / 100)}</span></div>
            <a href="checkout.html" class="btn btn-block">Checkout</a>
            <p class="secure-note">🔒 Secure checkout · 30-day returns</p>
          </aside>
        </div>`;
    }

    root.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      const line = (k) => Cart.lines().find((l) => Cart.key(l) === k);
      if (b.dataset.inc) Cart.setQty(b.dataset.inc, line(b.dataset.inc).qty + 1);
      if (b.dataset.dec) Cart.setQty(b.dataset.dec, line(b.dataset.dec).qty - 1);
      if (b.dataset.remove) Cart.remove(b.dataset.remove);
    });
    document.addEventListener("cart:change", render);
    render();
  })();
</script>
</body>
</html>
