<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Cpath d='M3 19 5 6l6.5 6.5L16 3l4.5 9.5L27 6l2 13Z' fill='%23b08d57'/%3E%3C/svg%3E">
<title>KROWN Jewelers</title>
</head>
<body data-page="product">
<div id="site-header"></div>

<main class="container" id="pdp-root"></main>

<section class="section section-cream" id="related-section" hidden>
  <div class="container">
    <div class="section-head"><div class="eyebrow">Complete the Look</div><h2>You May Also Like</h2></div>
    <div class="grid" id="related"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
  (function () {
    const { $, esc, money, shortMoney, param, product, cardHTML, priceHTML, addToCart, cfg } = window.K;
    const p = product(param("id"));
    const root = $("#pdp-root");

    if (!p) {
      root.innerHTML = `<div class="empty-state"><h1>Product not found</h1><p>This piece may no longer be available.</p><a class="btn" href="shop.html">Shop All Jewelry</a></div>`;
      return;
    }

    const cat = window.CATEGORIES.find((c) => c.id === p.category);
    const isRing = p.category === "rings";
    const state = { img: 0, size: null, qty: 1 };
    document.title = `${p.name} | KROWN Jewelers`;

    root.innerHTML = `
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="shop.html?cat=${cat.id}">${esc(cat.name)}</a> / ${esc(p.name)}</nav>
      <div class="pdp">
        <div class="gallery">
          <div class="gallery-main"><img id="main-img" src="${esc(p.images[0])}" alt="${esc(p.name)}" width="1000" height="1000"></div>
          <div class="thumbs">${p.images
            .map((src, i) => `<button data-img="${i}" aria-label="View photo ${i + 1}" aria-current="${i === 0}"><img src="${esc(src)}" alt="" width="200" height="200"></button>`)
            .join("")}</div>
        </div>
        <div class="pdp-info">
          <div class="eyebrow">${esc(cat.name)}</div>
          <h1>${esc(p.name)}</h1>
          <div class="pdp-price">${priceHTML(p)}${p.compareAt ? `<span class="save">Save ${money(p.compareAt - p.price)}</span>` : ""}</div>
          <p class="pdp-desc">${esc(p.description)}</p>
          ${
            isRing
              ? `<div><div class="opt-label"><span>Ring Size (US)</span><a href="help.html#faq">Size guide</a></div>
                 <div class="size-grid" id="sizes">${window.RING_SIZES.map((s) => `<button class="size-btn" data-size="${s}" aria-pressed="false">${s}</button>`).join("")}</div>
                 <div class="field-error" id="size-error" hidden>Please select a ring size.</div></div>`
              : ""
          }
          <div class="buy-row">
            <div class="qty" aria-label="Quantity"><button data-q="-1" aria-label="Decrease quantity">−</button><span id="qty">1</span><button data-q="1" aria-label="Increase quantity">+</button></div>
            <button class="btn" id="add">Add to Cart</button>
          </div>
          <button class="btn btn-outline btn-block" id="buy-now">Buy It Now</button>
          <div class="mini-trust">
            <span>Free shipping on orders over ${shortMoney(cfg.freeShippingOver)}</span>
            <span>30-day hassle-free returns</span>
            <span>Secure, encrypted checkout</span>
          </div>
          <div class="accordion">
            <details open><summary>Details</summary><div class="acc-body"><ul>${p.details.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div></details>
            <details><summary>Shipping &amp; Returns</summary><div class="acc-body">Orders are processed within 1–3 business days. Standard delivery takes 7–12 business days and is free over ${shortMoney(cfg.freeShippingOver)}. Not in love? Return it within 30 days. <a href="help.html#returns">Learn more</a></div></details>
            <details><summary>Jewelry Care</summary><div class="acc-body">Store in the pouch provided, away from moisture. Remove before swimming or exercising, and wipe gently with a soft cloth to restore shine.</div></details>
          </div>
        </div>
      </div>`;

    root.addEventListener("click", (e) => {
      const t = e.target.closest("[data-img]");
      if (t) {
        state.img = +t.dataset.img;
        $("#main-img").src = p.images[state.img];
        root.querySelectorAll("[data-img]").forEach((b) => b.setAttribute("aria-current", b === t));
      }
      const s = e.target.closest("[data-size]");
      if (s) {
        state.size = s.dataset.size;
        root.querySelectorAll("[data-size]").forEach((b) => b.setAttribute("aria-pressed", b === s));
        $("#size-error").hidden = true;
      }
      const q = e.target.closest("[data-q]");
      if (q) {
        state.qty = Math.min(10, Math.max(1, state.qty + +q.dataset.q));
        $("#qty").textContent = state.qty;
      }
    });

    function ready() {
      if (isRing && !state.size) {
        $("#size-error").hidden = false;
        $("#sizes").scrollIntoView({ block: "center", behavior: "smooth" });
        return false;
      }
      return true;
    }
    $("#add").addEventListener("click", () => ready() && addToCart(p.id, state.size, state.qty));
    $("#buy-now").addEventListener("click", () => {
      if (!ready()) return;
      window.K.Cart.add(p.id, state.size, state.qty);
      location.href = "checkout.html";
    });

    const related = window.PRODUCTS.filter((x) => x.id !== p.id && x.category === p.category)
      .concat(window.PRODUCTS.filter((x) => x.category !== p.category && x.badge === "Bestseller"))
      .slice(0, 4);
    $("#related").innerHTML = related.map(cardHTML).join("");
    $("#related-section").hidden = false;
  })();
</script>
</body>
</html>
